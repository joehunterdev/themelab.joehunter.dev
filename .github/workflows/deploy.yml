name: Build → dist branch (Hostinger webhook deploy)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Push only the dist/ contents to the `dist` branch.
      # Hostinger webhook should be set to deploy from the `dist` branch.
      - name: Push dist to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dist
          publish_dir: ./dist
          force_orphan: true
          allow_empty_commit: true
          commit_message: "build: ${{ github.sha }}"

      - name: Trigger Hostinger webhook
        run: curl -X POST "https://webhooks.hostinger.com/deploy/43d075e150b6a62783c98af9f14c2e4d"
